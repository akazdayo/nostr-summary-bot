name: Daily Run

on:
  schedule:
    - cron: "0 14 * * *" # Runs at 00:00 JST (15:00 UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run src/index.ts
        run: bun src/index.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BOT_SECRET_KEY: ${{ secrets.BOT_SECRET_KEY }}
          USER_PUBLIC_KEY: ${{ secrets.USER_PUBLIC_KEY }}
